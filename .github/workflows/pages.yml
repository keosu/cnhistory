name: Check and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check data and timeline behavior
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
          node --test tests/*.test.mjs
      - name: Package data and stage website
        run: |
          python scripts/package.py
          python scripts/build_site.py
      - name: Check staged website in Chromium
        run: |
          mkdir -p artifacts
          python scripts/serve.py --port 8000 > artifacts/server.log 2>&1 &
          python scripts/browser_check.py --url http://127.0.0.1:8000/_site
      - name: Upload browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: artifacts/
      - name: Upload Pages website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
